<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Аня. Сорок кадров о тебе</title>
<meta property="og:title" content="Аня. Сорок кадров о тебе">
<meta property="og:description" content="Открытка к дню рождения. Лучше со звуком.">
<meta property="og:image" content="hero.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="hero.jpg">
<link rel="preload" as="font" type="font/woff2" crossorigin href="cormorant-garamond-cyrillic-600-italic.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="manrope-cyrillic-400-normal.woff2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ИНТРО -->
<section id="intro" class="screen intro" aria-label="Начало">
  <div class="intro__bg"><img src="hero.jpg" alt=""></div>
  <canvas id="dust" class="intro__dust" aria-hidden="true"></canvas>
  <div class="intro__content">
    <div class="intro__date">16 октября 2026</div>
    <h1 class="intro__name">Аня</h1>
    <div class="intro__num" aria-label="40"><span class="popwrap"><span id="odo">0</span></span></div>
    <p class="intro__sub">сорок кадров о тебе</p>
    <button id="start" class="btn btn--primary" type="button">Смотреть</button>
    <p class="intro__hint">лучше со звуком · на весь экран</p>
  </div>
</section>

<!-- ПЛЕЕР -->
<section id="player" class="screen player" aria-label="Слайдшоу" hidden>
  <div class="player__top">
    <div class="player__counter" id="counter"></div>
    <div class="player__chapter" id="chapterName"></div>
    <button id="soundBtn" class="chip chip--sound" type="button" aria-pressed="false">
      <span class="chip__icon"></span><span class="chip__label">Звук выкл.</span>
    </button>
  </div>
  <div class="player__progress" id="progress"><i></i></div>
  <div class="stage" id="stage"></div>
  <div class="player__hint" id="hint">тап — дальше · удерживай — пауза · свайп — назад</div>
  <div class="player__pause" id="pauseMark" aria-hidden="true"></div>
  <button id="videoCta" class="player__cta" type="button" hidden><span class="chip__icon"></span>Включить звук</button>
  <div class="player__nav">
    <button class="player__zone player__zone--prev" id="zonePrev" type="button" aria-label="Назад"></button>
    <button class="player__zone player__zone--next" id="zoneNext" type="button" aria-label="Дальше"></button>
  </div>
</section>

<!-- ФИНАЛ -->
<section id="finale" class="screen finale" aria-label="Поздравление" hidden>
  <canvas id="confetti" class="finale__confetti" aria-hidden="true"></canvas>
  <div class="finale__hero">
    <img src="final.jpg" alt="">
    <div class="finale__title">
      <div class="finale__eyebrow">16 октября</div>
      <h2>С днём рождения,<br><em>Аня</em></h2>
    </div>
  </div>
  <div class="letter" id="letter"></div>
  <div class="marquee" id="marquee" aria-hidden="true">
    <div class="marquee__row marquee__row--a"></div>
    <div class="marquee__row marquee__row--b"></div>
  </div>
  <div class="finale__actions">
    <button id="again" class="btn btn--ghost" type="button">Посмотреть ещё раз</button>
    <div class="finale__foot">40 кадров · 7 видео · одна Аня</div>
  </div>
</section>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
